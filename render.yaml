services:

- type: web
  name: ai-quant
  runtime: docker
  plan: free
  dockerfilePath: ./Dockerfile
  dockerContext: .
  healthCheckPath: /health
  autoDeploy: true
  
  envVars:
  
  - key: HOST
    value: 0.0.0.0
  
  - key: PAPER_MODE
    value: "True"
  
  - key: PORT
    value: "10000"
  
  - key: DB_PATH
    value: /data/ai_quant.db
  
  - key: PYTHONUNBUFFERED
    value: "1"
  
  - key: PYTHONDONTWRITEBYTECODE
    value: "1"
  
  - key: SCAN_INTERVAL_SECONDS
    value: "180"
  
  - key: TIMEFRAME
    value: 15m
  
  - key: KLINE_LIMIT
    value: "300"
  
  - key: MIN_SCORE_TO_ENTER
    value: "72"
  
  disk:
  name: ai-quant-data
  mountPath: /data
  sizeGB: 1
